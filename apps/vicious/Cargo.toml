[package]
name = "vicious"
description = "Command-line front end: inspect, census, convert, run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vicious-core.workspace = true
vicious-pe.workspace = true
vicious-loader.workspace = true
vicious-hle.workspace = true
vicious-shader = { workspace = true, features = ["host"] }
vicious-game.workspace = true
anyhow.workspace = true
blake3.workspace = true
memchr.workspace = true
clap.workspace = true
walkdir.workspace = true

[features]
# Debug-level logs and the debugging switches (frame capture, stack dumps,
# the host debug layer, scripted keys). Off in a plain release build.
diagnostics = [
    "vicious-core/diagnostics",
    "vicious-hle/diagnostics",
    "vicious-loader/diagnostics",
    "vicious-shader/diagnostics",
]

[lints]
workspace = true
